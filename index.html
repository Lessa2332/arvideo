<style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
    body, html { width:100%; height:100%; overflow:hidden; background:#0a0a1a; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid #a78bfa; outline-offset:2px; }

    #video { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:0; }
    #ar-canvas { position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none; }

    .top-bar { position:absolute; top:max(16px, env(safe-area-inset-top, 16px)); left:14px; right:14px; display:flex; justify-content:space-between; z-index:200; gap:8px; }
    .top-bar button { background:rgba(10,10,26,0.85); backdrop-filter:blur(10px); border:1.5px solid #7c3aed; color:#a78bfa; padding:8px 16px; border-radius:40px; font-weight:bold; font-size:13px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .top-bar button:active { transform:scale(0.95); }

    #setup-screen { position:fixed; inset:0; background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; z-index:999; color:#fff; padding:max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); overflow-y:auto; }
    #setup-screen .logo { font-size:2.8rem; margin-bottom:4px; }
    #setup-screen h2 { background:linear-gradient(135deg,#7c3aed,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-size:1.8rem; margin-bottom:2px; font-weight:800; text-align:center; }
    #setup-screen .subtitle { color:rgba(167,139,250,0.8); font-size:13px; text-align:center; margin-bottom:16px; }
    
    .questions-container { width:100%; max-width:500px; display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
    .question-card { background:rgba(124,58,237,0.08); border:1px solid rgba(124,58,237,0.3); border-radius:14px; padding:12px 14px; }
    .question-card .q-input { background:rgba(10,10,26,0.8); border:1px solid rgba(124,58,237,0.4); color:#fff; padding:8px 12px; border-radius:8px; width:100%; font-size:14px; margin-bottom:8px; outline:none; }
    .question-card .q-select { background:rgba(10,10,26,0.8); border:1px solid rgba(124,58,237,0.4); color:#fff; padding:8px 12px; border-radius:8px; width:100%; font-size:14px; margin-bottom:8px; outline:none; }
    .question-card .q-remove { background:rgba(239,68,68,0.2); border:1px solid rgba(239,68,68,0.6); color:#ef4444; padding:6px 12px; border-radius:8px; font-size:12px; cursor:pointer; }

    .add-question-btn { background:rgba(124,58,237,0.15); border:2px dashed #7c3aed; color:#a78bfa; padding:12px; border-radius:14px; font-weight:bold; font-size:14px; cursor:pointer; width:100%; max-width:500px; margin-bottom:16px; }
    .generate-btn { background:linear-gradient(135deg,#7c3aed,#5b21b6); border:none; color:#fff; padding:14px 28px; border-radius:50px; font-weight:bold; font-size:16px; cursor:pointer; width:100%; max-width:500px; margin-bottom:16px; }

    .modal { position:fixed; inset:0; background:rgba(10,10,26,0.9); backdrop-filter:blur(10px); display:none; align-items:center; justify-content:center; z-index:1100; flex-direction:column; gap:16px; padding:24px; }
    .modal.visible { display:flex; }
    .modal .qr-box { background:white; padding:16px; border-radius:20px; box-shadow:0 0 40px rgba(124,58,237,.3); }
    .modal .close-btn { background:rgba(10,10,26,0.8); border:1px solid #7c3aed; color:#a78bfa; padding:10px 24px; border-radius:40px; font-weight:bold; cursor:pointer; }
    .modal .copy-link { color:#a78bfa; font-size:13px; cursor:pointer; text-decoration:underline; }

    #ar-screen { position:fixed; inset:0; background:#0a0a1a; display:none; flex-direction:column; z-index:1000; }
    #ar-screen.active { display:flex; }
    
    #question-display { position:absolute; top:max(20px, env(safe-area-inset-top, 20px)); left:16px; right:16px; z-index:300; }
    #question-text { background:rgba(10,10,26,0.85); backdrop-filter:blur(8px); border:1.5px solid #7c3aed; border-radius:16px; padding:16px; font-size:18px; font-weight:bold; color:#fff; text-align:center; }
    #gesture-hint { text-align:center; margin-top:8px; font-size:14px; color:#fbbf24; }
    
    #progress-bar { position:absolute; top:max(16px, env(safe-area-inset-top, 16px)); left:16px; right:16px; z-index:400; height:6px; background:rgba(124,58,237,0.15); border-radius:3px; overflow:hidden; }
    #progress-fill { height:100%; background:linear-gradient(90deg,#7c3aed,#a78bfa); width:0%; transition:width 0.3s; }
    #progress-text { text-align:center; margin-top:4px; font-size:12px; color:rgba(167,139,250,0.8); }

    #result-screen { position:absolute; inset:0; background:rgba(10,10,26,0.9); backdrop-filter:blur(10px); display:none; align-items:center; justify-content:center; z-index:500; flex-direction:column; gap:16px; padding:24px; }
    #result-screen.active { display:flex; }
    #result-text { font-size:24px; font-weight:bold; color:#fff; text-align:center; }
    #result-score { font-size:48px; font-weight:800; background:linear-gradient(135deg,#7c3aed,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    #download-png { background:linear-gradient(135deg,#7c3aed,#5b21b6); border:none; color:#fff; padding:14px 28px; border-radius:50px; font-weight:bold; font-size:16px; cursor:pointer; }
    #restart-btn { background:rgba(10,10,26,0.8); border:1px solid #7c3aed; color:#a78bfa; padding:10px 24px; border-radius:40px; font-weight:bold; cursor:pointer; }

    .gesture-emoji { font-size:40px; display:block; margin:8px 0; }
    .hidden { display:none; }
</style>

<!-- Підключення бібліотеки QRCode (обов'язково!) -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<!-- Setup screen (вчитель) -->
<div id="setup-screen">
    <div class="logo">🧠</div>
    <h2>AR Тест Генератор</h2>
    <p class="subtitle">Створіть тест на 12 запитань з жестами 👍 👎 👌</p>

    <div id="questions-container" class="questions-container"></div>
    <button id="add-question" class="add-question-btn">+ Додати запитання</button>
    <button id="generate-test" class="generate-btn">📲 Створити тест</button>
</div>

<!-- Модальне вікно з QR -->
<div id="qr-modal" class="modal">
    <h3 style="color:#fff;">Відскануйте QR-код</h3>
    <div class="qr-box" id="qr-container"></div>
    <p style="color:#a78bfa; font-size:12px;">або скопіюйте посилання:</p>
    <p id="share-link" style="color:#fff; background:rgba(10,10,26,0.8); padding:8px 12px; border-radius:8px; word-break:break-all; max-width:90%;"></p>
    <button id="copy-link" class="copy-link">📋 Копіювати посилання</button>
    <button id="close-modal" class="close-btn">Закрити</button>
</div>

<!-- AR екран (учень) -->
<div id="ar-screen">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="ar-canvas"></canvas>

    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="progress-text">Питання 1 / 12</div>

    <div id="question-display">
        <div id="question-text"></div>
        <div id="gesture-hint"></div>
    </div>

    <div id="result-screen">
        <div id="result-text">Тест завершено!</div>
        <div id="result-score">0/12</div>
        <button id="download-png">📥 Завантажити PNG-звіт</button>
        <button id="restart-btn">🔄 Пройти ще раз</button>
    </div>

    <div class="top-bar">
        <button id="camera-toggle" aria-label="Перемкнути камеру">📷 Камера</button>
    </div>
</div>

<script type="module">
    import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm';

    // ---------- Конфігурація ----------
    const MAX_QUESTIONS = 12;
    const GESTURES = {
        OK: '👌',
        THUMBS_UP: '👍',
        THUMBS_DOWN: '👎'
    };
    const GESTURE_LABELS = {
        OK: 'Жест OK (з\'єднати великий та вказівний)',
        THUMBS_UP: 'Палець вгору',
        THUMBS_DOWN: 'Палець вниз'
    };

    // ---------- Стан ----------
    let questions = []; // { text, correctGesture }
    let handLandmarker = null;
    let handVisible = false;
    let lastVideoTime = -1;
    let detectionRunning = false;
    let currentQuestionIndex = 0;
    let correctCount = 0;
    let gestureStabilityCounter = 0;
    let requiredStability = 5;
    let facingMode = 'user';
    let videoEl = document.getElementById('video');
    let arCanvas = document.getElementById('ar-canvas');
    let arCtx = arCanvas.getContext('2d');

    // ---------- DOM елементи ----------
    const setupScreen = document.getElementById('setup-screen');
    const arScreen = document.getElementById('ar-screen');
    const questionsContainer = document.getElementById('questions-container');
    const addQuestionBtn = document.getElementById('add-question');
    const generateTestBtn = document.getElementById('generate-test');
    const qrModal = document.getElementById('qr-modal');
    const qrContainer = document.getElementById('qr-container');
    const shareLinkEl = document.getElementById('share-link');
    const copyLinkBtn = document.getElementById('copy-link');
    const closeModalBtn = document.getElementById('close-modal');
    const questionTextEl = document.getElementById('question-text');
    const gestureHintEl = document.getElementById('gesture-hint');
    const progressFill = document.getElementById('progress-fill');
    const progressText = document.getElementById('progress-text');
    const resultScreen = document.getElementById('result-screen');
    const resultScore = document.getElementById('result-score');
    const downloadPngBtn = document.getElementById('download-png');
    const restartBtn = document.getElementById('restart-btn');
    const cameraToggleBtn = document.getElementById('camera-toggle');

    // ---------- Управління запитаннями (вчитель) ----------
    function renderQuestions() {
        questionsContainer.innerHTML = '';
        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <input type="text" class="q-input" placeholder="Текст запитання ${index+1}" value="${q.text}" data-index="${index}" />
                <select class="q-select" data-index="${index}">
                    <option value="OK" ${q.correctGesture === 'OK' ? 'selected' : ''}>👌 OK</option>
                    <option value="THUMBS_UP" ${q.correctGesture === 'THUMBS_UP' ? 'selected' : ''}>👍 Палець вгору</option>
                    <option value="THUMBS_DOWN" ${q.correctGesture === 'THUMBS_DOWN' ? 'selected' : ''}>👎 Палець вниз</option>
                </select>
                <button class="q-remove" data-index="${index}">Видалити</button>
            `;
            questionsContainer.appendChild(card);
        });

        // Оновлення подій
        document.querySelectorAll('.q-input').forEach(input => {
            input.addEventListener('input', (e) => {
                const idx = parseInt(e.target.dataset.index);
                questions[idx].text = e.target.value;
            });
        });
        document.querySelectorAll('.q-select').forEach(select => {
            select.addEventListener('change', (e) => {
                const idx = parseInt(e.target.dataset.index);
                questions[idx].correctGesture = e.target.value;
            });
        });
        document.querySelectorAll('.q-remove').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(e.target.dataset.index);
                questions.splice(idx, 1);
                renderQuestions();
            });
        });
    }

    addQuestionBtn.addEventListener('click', () => {
        if (questions.length >= MAX_QUESTIONS) {
            alert(`Максимум ${MAX_QUESTIONS} запитань!`);
            return;
        }
        questions.push({ text: '', correctGesture: 'OK' });
        renderQuestions();
    });

    generateTestBtn.addEventListener('click', () => {
        // Перевірка на пусті питання
        const valid = questions.filter(q => q.text.trim() !== '');
        if (valid.length === 0) {
            alert('Додайте хоча б одне запитання!');
            return;
        }
        // Кодуємо дані у URL
        const data = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(valid)))));
        const url = `${window.location.origin}${window.location.pathname}?test=${data}`;
        shareLinkEl.textContent = url;
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, {
            text: url,
            width: 200,
            height: 200,
            colorDark: "#0a0a1a",
            colorLight: "#ffffff"
        });
        qrModal.classList.add('visible');
    });

    copyLinkBtn.addEventListener('click', async () => {
        const link = shareLinkEl.textContent;
        if (link && navigator.clipboard?.writeText) {
            try {
                await navigator.clipboard.writeText(link);
                copyLinkBtn.textContent = '✅ Скопійовано!';
                setTimeout(() => copyLinkBtn.textContent = '📋 Копіювати посилання', 2000);
            } catch(e) {}
        }
    });

    closeModalBtn.addEventListener('click', () => {
        qrModal.classList.remove('visible');
    });

    // ---------- Ініціалізація AR-режиму (учень) ----------
    const urlParams = new URLSearchParams(window.location.search);
    const testData = urlParams.get('test');

    if (testData) {
        setupScreen.style.display = 'none';
        arScreen.classList.add('active');
        try {
            const decoded = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(testData)))));
            questions = decoded;
            if (questions.length > 0) {
                startAR();
            } else {
                alert('Тест порожній!');
            }
        } catch(e) {
            alert('Помилка декодування тесту!');
        }
    }

    // ---------- AR логіка ----------
    async function startAR() {
        try {
            await initCamera();
            await initHandDetection();
            displayQuestion(0);
            detectGestureLoop();
        } catch(e) {
            console.error(e);
            alert('Помилка ініціалізації AR: ' + e.message);
        }
    }

    async function initCamera() {
        if (videoEl.srcObject) {
            videoEl.srcObject.getTracks().forEach(t => t.stop());
            videoEl.srcObject = null;
        }
        if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error('Камера недоступна');
        }
        const constraints = {
            video: {
                facingMode,
                width: { ideal: 640 },
                height: { ideal: 480 }
            },
            audio: false
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        videoEl.srcObject = stream;
        await videoEl.play();
        // Налаштування canvas
        const resizeCanvas = () => {
            arCanvas.width = videoEl.videoWidth || 640;
            arCanvas.height = videoEl.videoHeight || 480;
        };
        resizeCanvas();
        videoEl.addEventListener('loadedmetadata', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);
    }

    async function initHandDetection() {
        const vision = await FilesetResolver.forVisionTasks(
            'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm'
        );
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
            baseOptions: {
                modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                delegate: 'GPU'
            },
            runningMode: 'VIDEO',
            numHands: 1
        });
    }

    function displayQuestion(index) {
        if (index >= questions.length) {
            showResult();
            return;
        }
        const q = questions[index];
        questionTextEl.textContent = q.text;
        gestureHintEl.innerHTML = `Покажіть жест: <span class="gesture-emoji">${GESTURES[q.correctGesture]}</span>`;
        progressText.textContent = `Питання ${index+1} / ${questions.length}`;
        progressFill.style.width = `${((index) / questions.length) * 100}%`;
        currentQuestionIndex = index;
        // Скидаємо стабільність жесту
        gestureStabilityCounter = 0;
        handVisible = false;
    }

    function showResult() {
        progressFill.style.width = '100%';
        progressText.textContent = 'Тест завершено';
        questionTextEl.textContent = '';
        gestureHintEl.textContent = '';
        resultScore.textContent = `${correctCount}/${questions.length}`;
        resultScreen.classList.add('active');
    }

    downloadPngBtn.addEventListener('click', generatePNGReport);
    restartBtn.addEventListener('click', () => {
        resultScreen.classList.remove('active');
        correctCount = 0;
        displayQuestion(0);
    });

    // ---------- Розпізнавання жестів ----------
    function detectGesture(landmarks) {
        // OK: відстань між кінчиком великого (4) та вказівного (8) мала
        const okDist = Math.hypot(
            landmarks[4].x - landmarks[8].x,
            landmarks[4].y - landmarks[8].y,
            landmarks[4].z - landmarks[8].z
        );
        const palmSize = Math.hypot(
            landmarks[0].x - landmarks[9].x,
            landmarks[0].y - landmarks[9].y,
            landmarks[0].z - landmarks[9].z
        ) || 0.001;
        const isOK = okDist < palmSize * 0.4;

        // Thumbs up: великий палець вище за інші, решта зігнуті
        const thumbTip = landmarks[4];
        const indexTip = landmarks[8];
        const middleTip = landmarks[12];
        const ringTip = landmarks[16];
        const pinkyTip = landmarks[20];
        const isThumbUp = thumbTip.y < indexTip.y - 0.05 && 
                          thumbTip.y < middleTip.y - 0.05 &&
                          thumbTip.y < ringTip.y - 0.05 &&
                          thumbTip.y < pinkyTip.y - 0.05;

        // Thumbs down: великий палець нижче за інші
        const isThumbDown = thumbTip.y > indexTip.y + 0.05 &&
                            thumbTip.y > middleTip.y + 0.05 &&
                            thumbTip.y > ringTip.y + 0.05 &&
                            thumbTip.y > pinkyTip.y + 0.05;

        if (isOK) return 'OK';
        if (isThumbUp) return 'THUMBS_UP';
        if (isThumbDown) return 'THUMBS_DOWN';
        return null;
    }

    async function detectGestureLoop() {
        if (!handLandmarker || !videoEl.videoWidth) {
            requestAnimationFrame(detectGestureLoop);
            return;
        }
        const now = performance.now();
        if (videoEl.currentTime !== lastVideoTime) {
            lastVideoTime = videoEl.currentTime;
            try {
                const result = handLandmarker.detectForVideo(videoEl, now);
                if (result.landmarks && result.landmarks.length > 0) {
                    const landmarks = result.landmarks[0];
                    const gesture = detectGesture(landmarks);
                    if (gesture) {
                        if (!handVisible) {
                            handVisible = true;
                            gestureStabilityCounter = 0;
                        }
                        gestureStabilityCounter++;
                        if (gestureStabilityCounter >= requiredStability) {
                            // Жест стабільний - перевіряємо
                            const currentQ = questions[currentQuestionIndex];
                            if (gesture === currentQ.correctGesture) {
                                correctCount++;
                            }
                            handVisible = false;
                            gestureStabilityCounter = 0;
                            displayQuestion(currentQuestionIndex + 1);
                        }
                    } else {
                        handVisible = false;
                        gestureStabilityCounter = 0;
                    }
                } else {
                    handVisible = false;
                    gestureStabilityCounter = 0;
                }
            } catch(e) {
                // Ігноруємо помилки детекції
            }
        }
        requestAnimationFrame(detectGestureLoop);
    }

    cameraToggleBtn.addEventListener('click', async () => {
        facingMode = facingMode === 'user' ? 'environment' : 'user';
        await initCamera();
    });

    // ---------- Генерація PNG-звіту ----------
    function generatePNGReport() {
        const canvas = document.createElement('canvas');
        canvas.width = 800;
        canvas.height = 600;
        const ctx = canvas.getContext('2d');

        // Фон
        ctx.fillStyle = '#0a0a1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Рамка
        ctx.strokeStyle = '#7c3aed';
        ctx.lineWidth = 4;
        ctx.strokeRect(20, 20, canvas.width-40, canvas.height-40);

        // Текст
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px Segoe UI, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('AR Тест Генератор', canvas.width/2, 80);
        
        ctx.fillStyle = '#a78bfa';
        ctx.font = 'bold 28px Segoe UI, sans-serif';
        ctx.fillText('Результат тесту', canvas.width/2, 140);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 72px Segoe UI, sans-serif';
        ctx.fillText(`${correctCount} / ${questions.length}`, canvas.width/2, 280);

        ctx.fillStyle = '#a78bfa';
        ctx.font = '28px Segoe UI, sans-serif';
        const percent = questions.length > 0 ? Math.round((correctCount / questions.length) * 100) : 0;
        ctx.fillText(`Успішність: ${percent}%`, canvas.width/2, 360);

        // Дата
        ctx.fillStyle = 'rgba(167,139,250,0.6)';
        ctx.font = '18px Segoe UI, sans-serif';
        ctx.fillText(new Date().toLocaleString('uk-UA'), canvas.width/2, 440);

        // Завантаження
        const link = document.createElement('a');
        link.download = 'ar-test-report.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    // ---------- Ініціалізація при завантаженні ----------
    renderQuestions();
    if (questions.length === 0) {
        questions.push({ text: '', correctGesture: 'OK' });
        renderQuestions();
    }
</script>

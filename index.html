<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AR Тест Генератор | SmartLessa</title>

    <!-- QR Code -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg: #0d1117;
            --surface: rgba(255, 255, 255, 0.06);
            --surface-hover: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.12);
            --text: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #00e5a0;
            --accent-glow: rgba(0, 229, 160, 0.35);
            --danger: #ff6b6b;
            --warning: #ffd166;
            --radius: 20px;
            --radius-sm: 12px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
        body, html { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:var(--font); }
        button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

        #video { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:0; transition: transform 0.15s ease; }
        #ar-canvas { position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none; }

        /* ---------- Загальні елементи ---------- */
        .glass {
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            color: var(--text);
            background: var(--surface);
            -webkit-tap-highlight-color: transparent;
            min-height: 48px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary {
            background: var(--accent);
            color: #0d1117;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn-primary:hover { background: #00d094; }
        .btn-outline {
            border: 1px solid var(--border);
            background: transparent;
        }
        .btn-outline:hover { background: var(--surface-hover); }

        /* ---------- Екран налаштування ---------- */
        #setup-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            z-index: 999;
            color: var(--text);
            padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
            overflow-y: auto;
        }
        #setup-screen .logo {
            font-size: 3rem;
            margin-bottom: 6px;
            filter: drop-shadow(0 0 10px var(--accent-glow));
        }
        #setup-screen h1 {
            font-size: clamp(1.8rem, 6vw, 2.4rem);
            margin-bottom: 4px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff, #b0b8c4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #setup-screen .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 20px;
        }

        .questions-container {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .question-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px;
            backdrop-filter: blur(8px);
        }
        .question-card .q-input,
        .question-card .q-select {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 14px;
            border-radius: 10px;
            width: 100%;
            font-size: 15px;
            margin-bottom: 10px;
            outline: none;
            transition: border 0.2s;
        }
        .question-card .q-input:focus,
        .question-card .q-select:focus {
            border-color: var(--accent);
        }
        .question-card .q-select option {
            background: #1c2128;
            color: var(--text);
        }
        .question-card .q-remove {
            background: rgba(255,107,107,0.1);
            border: 1px solid rgba(255,107,107,0.4);
            color: var(--danger);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .question-card .q-remove:hover {
            background: rgba(255,107,107,0.2);
        }

        .add-question-btn {
            background: rgba(255,255,255,0.03);
            border: 2px dashed rgba(255,255,255,0.2);
            color: var(--text-secondary);
            padding: 14px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            max-width: 560px;
            margin-bottom: 16px;
            transition: all 0.2s;
        }
        .add-question-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .generate-btn {
            background: var(--accent);
            color: #0d1117;
            padding: 16px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 17px;
            cursor: pointer;
            width: 100%;
            max-width: 560px;
            margin-bottom: 20px;
            border: none;
            box-shadow: 0 6px 20px var(--accent-glow);
            transition: all 0.2s;
        }
        .generate-btn:active { transform: scale(0.97); }

        /* ---------- Модальне вікно QR ---------- */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1100;
            flex-direction: column;
            gap: 16px;
            padding: 24px;
        }
        .modal.visible { display: flex; }
        .modal .qr-box {
            background: white;
            padding: 18px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .modal .close-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .modal .copy-link {
            color: var(--accent);
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
        }
        .modal #share-link {
            color: var(--text);
            background: rgba(255,255,255,0.05);
            padding: 10px 14px;
            border-radius: 10px;
            word-break: break-all;
            max-width: 90%;
            font-size: 13px;
        }

        /* ---------- AR екран ---------- */
        #ar-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: none;
            flex-direction: column;
            z-index: 1000;
        }
        #ar-screen.active { display: flex; }

        #question-display {
            position: absolute;
            top: max(18px, env(safe-area-inset-top, 18px));
            left: 16px;
            right: 16px;
            z-index: 300;
            pointer-events: none;
        }
        #question-text {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px 20px;
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            font-weight: 600;
            color: var(--text);
            text-align: center;
        }
        #gesture-hint {
            text-align: center;
            margin-top: 10px;
            font-size: 1rem;
            color: var(--warning);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 8px 12px;
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
        }
        .gesture-emoji {
            font-size: 2.2rem;
            display: block;
            margin: 4px 0;
        }

        #feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 350;
            font-size: 2.5rem;
            font-weight: 700;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #feedback.show { opacity: 1; }
        #feedback.correct { color: var(--accent); }
        #feedback.incorrect { color: var(--danger); }

        #progress-bar {
            position: absolute;
            top: max(14px, env(safe-area-inset-top, 14px));
            left: 16px;
            right: 16px;
            z-index: 400;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
            border-radius: 4px;
        }
        #progress-text {
            text-align: center;
            margin-top: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        #next-btn {
            position: absolute;
            bottom: max(30px, env(safe-area-inset-bottom, 30px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 450;
            padding: 16px 32px;
            border-radius: 50px;
            background: var(--accent);
            color: #0d1117;
            font-size: 18px;
            font-weight: 700;
            border: none;
            box-shadow: 0 6px 20px var(--accent-glow);
            display: none;
            cursor: pointer;
            min-width: 200px;
        }
        #next-btn.show { display: block; }

        #result-screen {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(16px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
            flex-direction: column;
            gap: 18px;
            padding: 24px;
        }
        #result-screen.active { display: flex; }
        #result-text { font-size: 1.8rem; font-weight: 700; color: var(--text); text-align: center; }
        #result-score { font-size: 4rem; font-weight: 800; color: var(--accent); }
        #download-png, #restart-btn {
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            border: none;
        }
        #download-png { background: var(--accent); color: #0d1117; }
        #restart-btn { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

        .top-bar {
            position: absolute;
            top: max(10px, env(safe-area-inset-top, 10px));
            right: 14px;
            z-index: 200;
            display: flex;
            gap: 8px;
        }
        .top-bar button {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        /* ---------- Адаптація для малих екранів ---------- */
        @media (max-width: 480px) {
            .btn, .generate-btn, .add-question-btn {
                font-size: 15px;
                padding: 12px 20px;
            }
            #next-btn {
                padding: 14px 24px;
                font-size: 16px;
                min-width: 160px;
                bottom: 20px;
            }
            #question-text {
                padding: 14px 16px;
                font-size: 1rem;
            }
            .gesture-emoji { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <!-- Екран налаштування (вчитель) -->
    <div id="setup-screen">
        <div class="logo">🧪</div>
        <h1>AR Тест Генератор</h1>
        <p class="subtitle">Створіть інтерактивний тест з жестами 👍 👎 👌</p>

        <div id="questions-container" class="questions-container"></div>
        <button id="add-question" class="add-question-btn">+ Додати запитання</button>
        <button id="generate-test" class="generate-btn">📲 Створити тест</button>
    </div>

    <!-- Модальне вікно QR -->
    <div id="qr-modal" class="modal">
        <h3 style="color:var(--text);">Відскануйте QR-код</h3>
        <div class="qr-box" id="qr-container"></div>
        <p style="color:var(--text-secondary); font-size:13px;">або скопіюйте посилання:</p>
        <p id="share-link"></p>
        <button id="copy-link" class="copy-link">📋 Копіювати посилання</button>
        <button id="close-modal" class="close-btn">Закрити</button>
    </div>

    <!-- AR екран (учень) -->
    <div id="ar-screen">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="ar-canvas"></canvas>

        <div id="progress-bar"><div id="progress-fill"></div></div>
        <div id="progress-text">Питання 1 / 12</div>

        <div id="question-display">
            <div id="question-text"></div>
            <div id="gesture-hint"></div>
        </div>

        <div id="feedback"></div>

        <button id="next-btn">Наступне питання →</button>

        <div id="result-screen">
            <div id="result-text">Тест завершено!</div>
            <div id="result-score">0/12</div>
            <button id="download-png">📥 Завантажити PNG-звіт</button>
            <button id="restart-btn">🔄 Пройти ще раз</button>
        </div>

        <div class="top-bar">
            <button id="camera-toggle" aria-label="Перемкнути камеру">📷 Камера</button>
        </div>
    </div>

    <script type="module">
        import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm';

        // ---------- Конфігурація ----------
        const MAX_QUESTIONS = 12;
        const GESTURES = {
            OK: '👌',
            THUMBS_UP: '👍',
            THUMBS_DOWN: '👎'
        };

        // ---------- Стан ----------
        let questions = [];
        let handLandmarker = null;
        let handVisible = false;
        let lastVideoTime = -1;
        let currentQuestionIndex = 0;
        let correctCount = 0;
        let gestureStabilityCounter = 0;
        const requiredStability = 8; // трохи повільніше
        let facingMode = 'user';
        let answerLocked = false;

        const videoEl = document.getElementById('video');
        const arCanvas = document.getElementById('ar-canvas');
        const arCtx = arCanvas.getContext('2d');

        // DOM елементи
        const setupScreen = document.getElementById('setup-screen');
        const arScreen = document.getElementById('ar-screen');
        const questionsContainer = document.getElementById('questions-container');
        const addQuestionBtn = document.getElementById('add-question');
        const generateTestBtn = document.getElementById('generate-test');
        const qrModal = document.getElementById('qr-modal');
        const qrContainer = document.getElementById('qr-container');
        const shareLinkEl = document.getElementById('share-link');
        const copyLinkBtn = document.getElementById('copy-link');
        const closeModalBtn = document.getElementById('close-modal');
        const questionTextEl = document.getElementById('question-text');
        const gestureHintEl = document.getElementById('gesture-hint');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const resultScreen = document.getElementById('result-screen');
        const resultScore = document.getElementById('result-score');
        const downloadPngBtn = document.getElementById('download-png');
        const restartBtn = document.getElementById('restart-btn');
        const cameraToggleBtn = document.getElementById('camera-toggle');
        const nextBtn = document.getElementById('next-btn');
        const feedbackEl = document.getElementById('feedback');

        // ---------- Управління запитаннями (вчитель) ----------
        function renderQuestions() {
            questionsContainer.innerHTML = '';
            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.innerHTML = `
                    <input type="text" class="q-input" placeholder="Текст запитання ${index+1}" value="${q.text}" data-index="${index}" />
                    <select class="q-select" data-index="${index}">
                        <option value="OK" ${q.correctGesture === 'OK' ? 'selected' : ''}>👌 OK</option>
                        <option value="THUMBS_UP" ${q.correctGesture === 'THUMBS_UP' ? 'selected' : ''}>👍 Палець вгору</option>
                        <option value="THUMBS_DOWN" ${q.correctGesture === 'THUMBS_DOWN' ? 'selected' : ''}>👎 Палець вниз</option>
                    </select>
                    <button class="q-remove" data-index="${index}">Видалити</button>
                `;
                questionsContainer.appendChild(card);
            });

            document.querySelectorAll('.q-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = parseInt(e.target.dataset.index);
                    questions[idx].text = e.target.value;
                });
            });
            document.querySelectorAll('.q-select').forEach(select => {
                select.addEventListener('change', (e) => {
                    const idx = parseInt(e.target.dataset.index);
                    questions[idx].correctGesture = e.target.value;
                });
            });
            document.querySelectorAll('.q-remove').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(e.target.dataset.index);
                    questions.splice(idx, 1);
                    renderQuestions();
                });
            });
        }

        addQuestionBtn.addEventListener('click', () => {
            if (questions.length >= MAX_QUESTIONS) {
                alert(`Максимум ${MAX_QUESTIONS} запитань!`);
                return;
            }
            questions.push({ text: '', correctGesture: 'OK' });
            renderQuestions();
        });

        generateTestBtn.addEventListener('click', () => {
            const valid = questions.filter(q => q.text.trim() !== '');
            if (valid.length === 0) {
                alert('Додайте хоча б одне запитання!');
                return;
            }
            const data = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(valid)))));
            const url = `${window.location.origin}${window.location.pathname}?test=${data}`;
            shareLinkEl.textContent = url;
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, {
                text: url,
                width: 200,
                height: 200,
                colorDark: "#0d1117",
                colorLight: "#ffffff"
            });
            qrModal.classList.add('visible');
        });

        copyLinkBtn.addEventListener('click', async () => {
            const link = shareLinkEl.textContent;
            if (link && navigator.clipboard?.writeText) {
                try {
                    await navigator.clipboard.writeText(link);
                    copyLinkBtn.textContent = '✅ Скопійовано!';
                    setTimeout(() => copyLinkBtn.textContent = '📋 Копіювати посилання', 2000);
                } catch(e) {}
            }
        });

        closeModalBtn.addEventListener('click', () => {
            qrModal.classList.remove('visible');
        });

        // ---------- Ініціалізація AR-режиму (учень) ----------
        const urlParams = new URLSearchParams(window.location.search);
        const testData = urlParams.get('test');

        if (testData) {
            setupScreen.style.display = 'none';
            arScreen.classList.add('active');
            try {
                const decoded = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(testData)))));
                questions = decoded;
                if (questions.length > 0) {
                    startAR();
                } else {
                    alert('Тест порожній!');
                }
            } catch(e) {
                alert('Помилка декодування тесту!');
            }
        }

        // ---------- AR логіка ----------
        async function startAR() {
            try {
                await initCamera();
                await initHandDetection();
                displayQuestion(0);
                detectGestureLoop();
            } catch(e) {
                console.error(e);
                alert('Помилка ініціалізації AR: ' + e.message);
            }
        }

        async function initCamera() {
            if (videoEl.srcObject) {
                videoEl.srcObject.getTracks().forEach(t => t.stop());
                videoEl.srcObject = null;
            }
            if (!navigator.mediaDevices?.getUserMedia) {
                throw new Error('Камера недоступна');
            }

            // Адаптивна роздільна здатність
            const isLowMemory = ('deviceMemory' in navigator) && navigator.deviceMemory < 2;
            const width = isLowMemory ? 320 : 640;
            const height = isLowMemory ? 240 : 480;

            const constraints = {
                video: {
                    facingMode,
                    width: { ideal: width, max: width * 1.5 },
                    height: { ideal: height, max: height * 1.5 }
                },
                audio: false
            };

            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            videoEl.srcObject = stream;
            await videoEl.play();

            const resizeCanvas = () => {
                arCanvas.width = videoEl.videoWidth || width;
                arCanvas.height = videoEl.videoHeight || height;
            };
            resizeCanvas();
            videoEl.addEventListener('loadedmetadata', resizeCanvas);
            window.addEventListener('resize', resizeCanvas);

            updateVideoMirror();
        }

        function updateVideoMirror() {
            if (facingMode === 'user') {
                videoEl.style.transform = 'scaleX(-1)';
            } else {
                videoEl.style.transform = 'none';
            }
        }

        async function initHandDetection() {
            // Визначаємо делегат: GPU якщо WebGL2 і достатньо пам'яті, інакше CPU
            let delegate = 'CPU';
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl2');
                const memoryOk = !('deviceMemory' in navigator) || navigator.deviceMemory >= 2;
                if (gl && memoryOk) {
                    delegate = 'GPU';
                }
            } catch(e) {
                delegate = 'CPU';
            }

            const vision = await FilesetResolver.forVisionTasks(
                'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm'
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                    delegate: delegate
                },
                runningMode: 'VIDEO',
                numHands: 1
            });
        }

        function displayQuestion(index) {
            if (index >= questions.length) {
                showResult();
                return;
            }
            const q = questions[index];
            questionTextEl.textContent = q.text;
            gestureHintEl.innerHTML = `Покажіть жест: <span class="gesture-emoji">${GESTURES[q.correctGesture]}</span>`;
            progressText.textContent = `Питання ${index+1} / ${questions.length}`;
            progressFill.style.width = `${(index / questions.length) * 100}%`;
            currentQuestionIndex = index;
            gestureStabilityCounter = 0;
            handVisible = false;
            answerLocked = false;
            nextBtn.classList.remove('show');
            feedbackEl.classList.remove('show');
            feedbackEl.textContent = '';
        }

        function showResult() {
            progressFill.style.width = '100%';
            progressText.textContent = 'Тест завершено';
            questionTextEl.textContent = '';
            gestureHintEl.textContent = '';
            resultScore.textContent = `${correctCount}/${questions.length}`;
            resultScreen.classList.add('active');
        }

        nextBtn.addEventListener('click', () => {
            if (answerLocked) {
                displayQuestion(currentQuestionIndex + 1);
            }
        });

        // ---------- Розпізнавання жестів ----------
        function detectGesture(landmarks) {
            const okDist = Math.hypot(
                landmarks[4].x - landmarks[8].x,
                landmarks[4].y - landmarks[8].y,
                landmarks[4].z - landmarks[8].z
            );
            const palmSize = Math.hypot(
                landmarks[0].x - landmarks[9].x,
                landmarks[0].y - landmarks[9].y,
                landmarks[0].z - landmarks[9].z
            ) || 0.001;
            const isOK = okDist < palmSize * 0.4;

            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const middleTip = landmarks[12];
            const ringTip = landmarks[16];
            const pinkyTip = landmarks[20];
            const isThumbUp = thumbTip.y < indexTip.y - 0.05 && 
                              thumbTip.y < middleTip.y - 0.05 &&
                              thumbTip.y < ringTip.y - 0.05 &&
                              thumbTip.y < pinkyTip.y - 0.05;
            const isThumbDown = thumbTip.y > indexTip.y + 0.05 &&
                                thumbTip.y > middleTip.y + 0.05 &&
                                thumbTip.y > ringTip.y + 0.05 &&
                                thumbTip.y > pinkyTip.y + 0.05;

            if (isOK) return 'OK';
            if (isThumbUp) return 'THUMBS_UP';
            if (isThumbDown) return 'THUMBS_DOWN';
            return null;
        }

        async function detectGestureLoop() {
            if (!handLandmarker || !videoEl.videoWidth || answerLocked) {
                requestAnimationFrame(detectGestureLoop);
                return;
            }
            const now = performance.now();
            if (videoEl.currentTime !== lastVideoTime) {
                lastVideoTime = videoEl.currentTime;
                try {
                    const result = handLandmarker.detectForVideo(videoEl, now);
                    if (result.landmarks && result.landmarks.length > 0) {
                        const landmarks = result.landmarks[0];
                        const gesture = detectGesture(landmarks);
                        if (gesture) {
                            if (!handVisible) {
                                handVisible = true;
                                gestureStabilityCounter = 0;
                            }
                            gestureStabilityCounter++;
                            if (gestureStabilityCounter >= requiredStability) {
                                // Зафіксувати відповідь
                                answerLocked = true;
                                handVisible = false;
                                gestureStabilityCounter = 0;
                                const currentQ = questions[currentQuestionIndex];
                                const isCorrect = gesture === currentQ.correctGesture;
                                if (isCorrect) correctCount++;
                                showFeedback(isCorrect);
                                nextBtn.classList.add('show');
                            }
                        } else {
                            handVisible = false;
                            gestureStabilityCounter = 0;
                        }
                    } else {
                        handVisible = false;
                        gestureStabilityCounter = 0;
                    }
                } catch(e) {
                    // Ігноруємо помилки детекції
                }
            }
            requestAnimationFrame(detectGestureLoop);
        }

        function showFeedback(isCorrect) {
            feedbackEl.textContent = isCorrect ? '✓ Правильно!' : '✗ Неправильно';
            feedbackEl.className = 'correct' === (isCorrect ? 'correct' : 'incorrect') ? 'correct' : 'incorrect';
            feedbackEl.classList.add('show');
            setTimeout(() => feedbackEl.classList.remove('show'), 1500);
        }

        cameraToggleBtn.addEventListener('click', async () => {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            await initCamera();
        });

        // ---------- Генерація PNG-звіту ----------
        function generatePNGReport() {
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 600;
            const ctx = canvas.getContext('2d');

            // Фон
            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Рамка
            ctx.strokeStyle = '#00e5a0';
            ctx.lineWidth = 4;
            ctx.strokeRect(20, 20, canvas.width-40, canvas.height-40);

            // Текст
            ctx.fillStyle = '#f0f6fc';
            ctx.font = 'bold 36px Segoe UI, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('AR Тест Генератор', canvas.width/2, 80);
            
            ctx.fillStyle = '#8b949e';
            ctx.font = 'bold 28px Segoe UI, sans-serif';
            ctx.fillText('Результат тесту', canvas.width/2, 140);

            ctx.fillStyle = '#00e5a0';
            ctx.font = 'bold 72px Segoe UI, sans-serif';
            ctx.fillText(`${correctCount} / ${questions.length}`, canvas.width/2, 280);

            ctx.fillStyle = '#f0f6fc';
            ctx.font = '28px Segoe UI, sans-serif';
            const percent = questions.length > 0 ? Math.round((correctCount / questions.length) * 100) : 0;
            ctx.fillText(`Успішність: ${percent}%`, canvas.width/2, 360);

            ctx.fillStyle = 'rgba(240,246,252,0.6)';
            ctx.font = '18px Segoe UI, sans-serif';
            ctx.fillText(new Date().toLocaleString('uk-UA'), canvas.width/2, 440);

            const link = document.createElement('a');
            link.download = 'ar-test-report.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        downloadPngBtn.addEventListener('click', generatePNGReport);
        restartBtn.addEventListener('click', () => {
            resultScreen.classList.remove('active');
            correctCount = 0;
            displayQuestion(0);
        });

        // ---------- Ініціалізація ----------
        renderQuestions();
        if (questions.length === 0) {
            questions.push({ text: '', correctGesture: 'OK' });
            renderQuestions();
        }
    </script>
</body>
</html>
